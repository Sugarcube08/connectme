name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: connectme_test
          MYSQL_DATABASE: connectme_test
          MYSQL_PASSWORD: connectme_test
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_test_only --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://connectme_test:connectme_test@localhost:3306/connectme_test
      TEST_DATABASE_URL: mysql://connectme_test:connectme_test@localhost:3306/connectme_test
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          pnpm --version

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ACCESS_CODE_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ACCESS_CODE_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply checked-in migrations
        run: pnpm db:migrate

      - name: Run API integration tests
        run: pnpm test

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Build workspaces
        run: pnpm build

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_USER=connectme_test
          export MYSQL_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_DATABASE=connectme_test
          export SESSION_SECRET="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ACCESS_CODE_PEPPER="$(openssl rand -hex 32)"
          export ACCESS_CODE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export NEXT_PUBLIC_APP_URL=https://connectme.example.test
          docker compose config --quiet

      - name: Build API container target
        run: docker build --target api -t connectme-api-ci .

      - name: Build web container target
        run: docker build --target web -t connectme-web-ci .
